name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows (x64)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade Pillow nuitka ordered-set zstandard

      - name: Build single-file executable with Nuitka
        run: python scripts/build.py --output-dir dist --output-name PhotoTo-windows-x64.exe

      - name: Smoke test binary
        shell: pwsh
        run: |
          $exe = Resolve-Path dist/PhotoTo-windows-x64.exe
          & $exe --version
          $smokeDir = Join-Path $env:TEMP "phototo-smoke"
          $proc = Start-Process -FilePath $exe -ArgumentList "--no-browser", "--port", "18500", "--dir", $smokeDir -PassThru
          try {
            $ok = $false
            for ($i = 0; $i -lt 30; $i++) {
              Start-Sleep -Milliseconds 500
              try {
                $r1 = Invoke-WebRequest -Uri "http://127.0.0.1:18500/" -UseBasicParsing -TimeoutSec 2
                $r2 = Invoke-WebRequest -Uri "http://127.0.0.1:18500/admin" -UseBasicParsing -TimeoutSec 2
                $info = Invoke-RestMethod -Uri "http://127.0.0.1:18500/api/info" -TimeoutSec 2
                if ($r1.StatusCode -eq 200 -and $r2.StatusCode -eq 200 -and $info.ok -and $info.pil) {
                  $ok = $true
                  break
                }
              } catch {}
            }
            if (-not $ok) {
              throw "Smoke test failed: server did not return healthy / , /admin and /api/info (pil=true)"
            }
            Write-Host "Smoke test passed (size: $((Get-Item $exe).Length) bytes)"
          } finally {
            if ($proc -and -not $proc.HasExited) {
              Stop-Process -Id $proc.Id -Force
            }
          }

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhotoTo-windows-x64
          path: dist/PhotoTo-windows-x64.exe
          if-no-files-found: error

  build-linux:
    name: Build Linux (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    container:
      image: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
            image: quay.io/pypa/manylinux_2_28_x86_64
          - arch: arm64
            runner: ubuntu-24.04-arm
            image: quay.io/pypa/manylinux_2_28_aarch64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract static libpython in manylinux
        run: |
          cd /opt/_internal
          tar xf static-libs-for-embedding-only.tar.xz

      - name: Install build dependencies (Python 3.12 in manylinux_2_28)
        run: |
          /opt/python/cp312-cp312/bin/python -m pip install --upgrade pip
          /opt/python/cp312-cp312/bin/python -m pip install --upgrade Pillow nuitka ordered-set zstandard

      - name: Build single-file binary with Nuitka
        run: |
          /opt/python/cp312-cp312/bin/python scripts/build.py \
            --output-dir dist \
            --output-name PhotoTo-linux-${{ matrix.arch }}
          chmod +x dist/PhotoTo-linux-${{ matrix.arch }}

      - name: Smoke test binary
        run: |
          BIN="./dist/PhotoTo-linux-${{ matrix.arch }}"
          "$BIN" --version
          "$BIN" --no-browser --port 18500 --dir /tmp/phototo-smoke &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          /opt/python/cp312-cp312/bin/python - <<'PY'
          import json, sys, time, urllib.request

          for _ in range(30):
              time.sleep(0.5)
              try:
                  with urllib.request.urlopen('http://127.0.0.1:18500/', timeout=2) as r1:
                      s1 = r1.status
                  with urllib.request.urlopen('http://127.0.0.1:18500/admin', timeout=2) as r2:
                      s2 = r2.status
                  with urllib.request.urlopen('http://127.0.0.1:18500/api/info', timeout=2) as r3:
                      info = json.loads(r3.read().decode('utf-8'))
                  if s1 == 200 and s2 == 200 and info.get('ok') and info.get('pil'):
                      print('Smoke test passed:', info.get('pil'))
                      sys.exit(0)
              except Exception:
                  pass
          print('Smoke test failed', file=sys.stderr)
          sys.exit(1)
          PY
          ls -lh "$BIN"

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhotoTo-linux-${{ matrix.arch }}
          path: dist/PhotoTo-linux-${{ matrix.arch }}
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: [build-windows, build-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA256 checksums
        run: |
          cd release-assets
          chmod +x PhotoTo-linux-*
          sha256sum PhotoTo-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Detect prerelease tag
        id: meta
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ steps.meta.outputs.prerelease }}
          files: release-assets/*
